# The workflows pin every action to a commit SHA, which is only safe while
# something moves the pins. One grouped pull request a month per ecosystem,
# so an update is a single CI run to read rather than a queue of them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  # Development tooling only: the plugin has no runtime Composer dependency,
  # and vendor/ never ships. Grouped because roots/wordpress and
  # wp-phpunit/wp-phpunit have to move to the same WordPress version together.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      composer-dev:
        patterns: ['*']

  # ESLint and its configuration, for the two scripts the plugin ships.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      npm-dev:
        patterns: ['*']
