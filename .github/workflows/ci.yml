# ubuntu-24.04 is pinned rather than -latest so the PHP 7.4 legs survive the
# eventual runner-image migration.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole of this before it makes a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # A pull request that only touches documentation cannot change what the
  # linters, the tests or Plugin Check see, so those jobs are skipped for it.
  # Everything else runs everything: a push to main, a tag, a manual run, and
  # any pull request with one file outside the list below.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # On a pull request this is the merge commit, and its first parent
          # is the base branch: two commits deep is enough to compare them.
          fetch-depth: 2

      # An allow-list, so a path nobody thought about counts as code. Nothing
      # on it reaches the zip or is read by a job below: readme.txt and
      # changelog.txt ship, and .distignore and the workflows decide what
      # does, so none of those is here. If git fails the step fails, and the
      # gate at the bottom fails with it, rather than skipping the tests.
      - name: Is anything but documentation touched?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          DOCS: '^([^/]+\.md|\.github/ISSUE_TEMPLATE/.*|\.github/PULL_REQUEST_TEMPLATE\.md|\.github/dependabot\.yml|\.wordpress-org/.*)$'
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only HEAD^1 HEAD)"
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE "$DOCS" <<<"$files"; then
              code=false
            fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "code=${code}"

  lint:
    name: PHPCS + PHPStan
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPCS
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      # The plugin must not fall back to curl or skip TLS verification. Both are
      # wordpress.org review failures and the second is a real vulnerability, so
      # they are checked as text rather than trusted to a sniff.
      - name: No raw HTTP clients, no disabled TLS
        run: |
          set -euo pipefail
          if grep -rnE "curl_init|file_get_contents\s*\(\s*['\"]https?:" --include='*.php' send4.php includes admin; then
            echo "::error::Use the WordPress HTTP API, not curl or file_get_contents." && exit 1
          fi
          # Matched loosely on whitespace: the alignment either side of the =>
          # moves whenever a neighbouring key in the args array grows, and a
          # guard that fails for that reason is a guard people learn to ignore.
          if grep -rn "sslverify" --include='*.php' send4.php includes admin | grep -vE "'sslverify'[[:space:]]*=>[[:space:]]*true" | grep -q .; then
            echo "::error::sslverify must be left true." && exit 1
          fi

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress ${{ matrix.wordpress || 'latest' }}${{ matrix.multisite == '1' && ', multisite' || '' }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # composer.lock holds the newest WordPress and form plugins, and a leg
      # that cannot run those names its own. `wordpress` and `cf7` are
      # optional: a leg without them tests exactly what the lock file says.
      matrix:
        include:
          # The floor: the oldest WordPress and PHP the plugin header
          # promises, with the last Contact Form 7 that runs on that
          # WordPress. A function newer than 6.2 fails here and nowhere else.
          - php: '7.4'
            wordpress: '6.2'
            cf7: '5.8'
            multisite: '0'
          # PHP 7.4 on current WordPress. Contact Form 7 needs PHP 8.3 from
          # 6.2 onwards, so a site still on 7.4 is on 6.1 at the newest.
          - php: '7.4'
            cf7: '6.1'
            multisite: '0'
          - php: '8.3'
            multisite: '0'
          # A multisite leg, because the installer's network branch is the
          # difference between one subsite having a queue table and every
          # other subsite on the network silently losing leads. Only on 8.3:
          # it is the same WordPress code either way, and the point is to run
          # tests/Integration/MultisiteInstallTest.php at all.
          - php: '8.3'
            multisite: '1'
          # The newest PHP hosts offer, for what it deprecates or removes.
          - php: '8.5'
            multisite: '0'
    services:
      db:
        image: mariadb:11.8.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_test
        ports:
          - 3306:3306
        # --su-mysql has to come first, and the start period keeps the first few
        # probes from failing while InnoDB initialises.
        options: >-
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-start-period=10s
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, gd
          coverage: none
          tools: composer:v2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # composer.json pins the platform to PHP 7.4.33, so this resolves the
      # same way whichever PHP runs it and only swaps the packages named. The
      # last step checks the swap happened: a leg that says 6.2 and quietly
      # tests the lock file's WordPress would be worse than no leg.
      - name: Pin this leg's WordPress and Contact Form 7
        if: matrix.wordpress || matrix.cf7
        env:
          WORDPRESS: ${{ matrix.wordpress }}
          CF7: ${{ matrix.cf7 }}
        run: |
          set -euo pipefail
          packages=()
          if [ -n "$WORDPRESS" ]; then
            packages+=("roots/wordpress:${WORDPRESS}.*" "wp-phpunit/wp-phpunit:${WORDPRESS}.*")
          fi
          if [ -n "$CF7" ]; then
            packages+=("wpackagist-plugin/contact-form-7:${CF7}.*")
          fi
          composer require --dev --no-interaction --no-progress --with-all-dependencies "${packages[@]}"
          if [ -n "$WORDPRESS" ]; then
            grep -qE "^\\\$wp_version = '${WORDPRESS//./\\.}[.']" tests/wordpress/wp-includes/version.php \
              || { echo "::error::WordPress ${WORDPRESS} was not installed."; exit 1; }
          fi
          if [ -n "$CF7" ]; then
            grep -qE "^ \* Version: ${CF7//./\\.}\." tests/plugins/contact-form-7/wp-contact-form-7.php \
              || { echo "::error::Contact Form 7 ${CF7} was not installed."; exit 1; }
          fi

      - name: PHPUnit
        env:
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_DB_NAME: wp_test
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: root
          WP_TESTS_MULTISITE: ${{ matrix.multisite }}
        run: vendor/bin/phpunit

  # Runs for a documentation-only pull request too, where the two jobs it
  # needs are skipped: .distignore is what keeps a new README-like file out of
  # the zip, and this is the job that would notice.
  zip:
    name: Distributable zip
    runs-on: ubuntu-24.04
    needs: [changes, lint, phpunit]
    if: ${{ !cancelled() && !failure() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build
        run: bin/build-zip.sh

      # wordpress.org rejects a plugin that ships its build tooling, and a
      # vendor directory in the zip would also mean shipping dev dependencies.
      - name: Nothing developer-only made it in
        run: |
          set -euo pipefail
          for unwanted in 'send4/vendor/' 'send4/tests/' 'send4/composer.json' 'send4/dev/' 'send4/docker/' 'send4/phpstan' '.dist'; do
            if unzip -l build/send4.zip | grep -q "$unwanted"; then
              echo "::error::${unwanted} must not be in the distributable zip." && exit 1
            fi
          done
          unzip -l build/send4.zip | grep -q 'send4/send4.php'
          unzip -l build/send4.zip | grep -q 'send4/readme.txt'
          # The repository's own Markdown is for GitHub; readme.txt is what a
          # site gets. A new one at the root ships unless .distignore names it.
          if unzip -Z1 build/send4.zip | grep -E '^send4/[^/]+\.md$'; then
            echo "::error::A Markdown file at the plugin root is in the zip. Name it in .distignore." && exit 1
          fi
          # Plugin Check reports any hidden file as an error (.dockerignore
          # once shipped because .distignore did not name it).
          if unzip -Z1 build/send4.zip | grep -E '(^|/)\.[^/]+/?$'; then
            echo "::error::Hidden files must not be in the distributable zip." && exit 1
          fi
          # And any name with a space or a special character, which is how
          # the picker's flags@2x.webp would have blocked the submission.
          if unzip -Z1 build/send4.zip | grep -E '[^A-Za-z0-9._/-]'; then
            echo "::error::File names in the zip may only use letters, digits, '.', '_', '-' and '/'." && exit 1
          fi

      # The mirror image of the check above. .distignore's `vendor` matches a
      # directory of that name at any depth, so a library vendored under
      # public/vendor/ would be stripped from a green build and the phone
      # picker would ship missing on every site. Asserted by name, because an
      # absence is otherwise invisible.
      - name: The bundled front-end library made it in
        run: |
          set -euo pipefail
          for wanted in \
            'send4/public/lib/intl-tel-input/js/utils.js' \
            'send4/public/lib/intl-tel-input/js/intlTelInput.min.js' \
            'send4/public/lib/intl-tel-input/LICENSE' \
            'send4/public/lib/intl-tel-input/img/flags.webp' \
            'send4/public/lib/intl-tel-input/img/flags-2x.webp' \
            'send4/public/js/phone-field.js' \
            'send4/public/css/phone-field.css' \
            'send4/public/css/phone-flags.css' \
            'send4/public/css/intl-tel-input-scoped.css'; do
            if ! unzip -l build/send4.zip | grep -q "$wanted"; then
              echo "::error::${wanted} is missing from the distributable zip." && exit 1
            fi
          done

      # Send4_Assets::url() serves these in preference to the plain names, so
      # that a CDN ignoring `?ver=` still fetches a new release.
      - name: Our own assets carry the version in their file names
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^ \* Version:' send4.php | awk '{print $3}')"
          for wanted in \
            "send4/public/js/phone-field.${VERSION}.js" \
            "send4/public/css/phone-field.${VERSION}.css" \
            "send4/public/css/phone-flags.${VERSION}.css" \
            "send4/public/css/intl-tel-input-scoped.${VERSION}.css" \
            "send4/admin/css/admin.${VERSION}.css"; do
            if ! unzip -l build/send4.zip | grep -qF "$wanted"; then
              echo "::error::${wanted} is missing from the distributable zip." && exit 1
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: send4-plugin
          path: build/send4.zip
          retention-days: 14

  # What WordPress.org runs on every upload, run on what we would upload: the
  # built zip, never the repository, which holds tests, tooling and vendor/.
  # Errors fail the job, as they block a submission; warnings are annotations
  # to read before a release.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-24.04
    needs: [changes, zip]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: send4-plugin
          path: build

      - name: Unpack the zip
        run: unzip -q build/send4.zip -d build

      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/send4

  # The one check the ruleset on main requires. The job names above change
  # with the matrix, and a job skipped by its `if` reports under a name with
  # the matrix left unexpanded, so requiring them one by one would leave a
  # documentation-only pull request waiting for checks that never arrive.
  #
  # Strict on purpose: the zip is always built, and the other three may be
  # skipped only when `changes` said the pull request is documentation. A job
  # skipped because the one before it failed, or because the run was
  # cancelled, does not pass.
  all-checks:
    name: All checks
    runs-on: ubuntu-24.04
    needs: [changes, lint, phpunit, zip, plugin-check]
    if: always()
    steps:
      - name: Every job passed, or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '
            (.changes.outputs.code // "true") as $code
            | .changes.result == "success"
            and .zip.result == "success"
            and ([.lint, .phpunit, ."plugin-check"]
                 | all(.result == "success" or ($code == "false" and .result == "skipped")))
          ' <<<"$NEEDS" > /dev/null || { echo "::error::A job failed, was cancelled, or was skipped when it should have run."; exit 1; }
