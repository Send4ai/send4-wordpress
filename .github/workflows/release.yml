# A pushed v* tag is a release (#1531).
#
#   1. ci              the whole of ci.yml, on the tagged commit.
#   2. github-release  the GitHub release with send4.zip, for the pilot sites
#                      and the WordPress.org reviewer. Touches no WordPress.org
#                      secret, and runs the same before and after approval.
#   3. wordpress-org   commits that same zip to the WordPress.org SVN. Skipped,
#                      not failed, until the repository variable WPORG_PUBLISH
#                      is 'true', which is set only once the plugin is approved.
#
# Run by hand (Actions → Release → Run workflow) to publish a tag that was cut
# before approval: only the wordpress-org job runs, dry run by default.
#
# The SVN password can push code to every site with auto-updates on, so the
# publishing job reads it from the wordpress-org environment and WordPress.org
# Release Confirmations ask a committer to confirm each release by email. On
# GitHub's Free plan only a public repository gets environment reviewers and
# tag rulesets, which is one reason this repository is public.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to publish to WordPress.org, e.g. v0.2.1'
        required: true
        type: string
      dry_run:
        description: 'Check out SVN and stage the files, but commit nothing'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # A tag pushed from a branch would put unreviewed code on every site.
      - name: The tag matches the version and is on main
        run: |
          set -euo pipefail
          bin/check-version.sh "$TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${TAG} is not on main."; exit 1; }

      - name: Build
        run: bin/build-zip.sh

      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          awk -v heading="= ${TAG#v} =" '
            $0 == heading { found = 1; next }
            found && /^= / { exit }
            found && /^== / { exit }
            found { print }
          ' readme.txt > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      # The gh CLI that ships on the runner, rather than one more third-party
      # action. A re-run replaces the asset: the tag never moves, so the zip
      # built from it is the same one.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/send4.zip --clobber
          else
            gh release create "$TAG" build/send4.zip \
              --verify-tag \
              --title "Send4 ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  wordpress-org:
    name: Publish to WordPress.org
    needs: [github-release]
    # On a dispatch the two jobs before this one are skipped, and a skipped
    # need skips its dependants unless the condition says otherwise. A job-level
    # if can read vars, but not secrets or environment variables.
    if: ${{ !failure() && !cancelled() && vars.WPORG_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    environment: wordpress-org
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The input is free text, so it is checked before anything uses it.
      - name: The tag is a release tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'${TAG}' is not a vX.Y.Z tag."; exit 1; }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: The tag matches the version and is on main
        id: version
        run: |
          set -euo pipefail
          VERSION="$(bin/check-version.sh "$TAG")"
          git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main \
            || { echo "::error::${TAG} is not on main."; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # SVN gets exactly the files a hand install gets: the release's zip, not
      # a second build that could differ from it.
      - name: Fetch the released zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern send4.zip --dir "$RUNNER_TEMP/release"
          unzip -q "$RUNNER_TEMP/release/send4.zip" -d "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/send4/send4.php"

      # Every input set explicitly. Left to its defaults the script would take
      # the slug from the repository name (send4-wordpress), the version from
      # GITHUB_REF (refs/heads/main on a dispatch), and read an empty dry-run as
      # true (`if $INPUT_DRY_RUN; then`).
      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: send4
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ${{ runner.temp }}/release/send4
          ASSETS_DIR: .wordpress-org
