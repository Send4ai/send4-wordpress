# Local development stack.
#
#   http://localhost:8088          WordPress with this plugin bind-mounted
#   http://localhost:8089          Adminer, if you need to look at the queue table
#
# The Send4 API it talks to defaults to a server on the host's port 8080. Override
# with SEND4_API_BASE_URL in .env.

x-wp-environment: &wp-environment
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: '1'
  SEND4_API_BASE_URL: ${SEND4_API_BASE_URL:-http://host.docker.internal:8080}
  SEND4_DEV_STUBS: ${SEND4_DEV_STUBS:-1}
  WORDPRESS_CONFIG_EXTRA: |
    define( 'SEND4_API_BASE_URL', getenv( 'SEND4_API_BASE_URL' ) );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );

x-wp-volumes: &wp-volumes
  - wordpress:/var/www/html
  - ./:/var/www/html/wp-content/plugins/send4
  - ./dev/mu-plugins:/var/www/html/wp-content/mu-plugins

services:
  db:
    image: mariadb:11.8.8
    container_name: send4-wp-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 3s
      retries: 24

  wordpress:
    image: wordpress:7.1.0-php8.3-apache
    container_name: send4-wp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${WP_HOST_PORT:-8088}:80'
    environment: *wp-environment
    volumes: *wp-volumes
    extra_hosts:
      # Docker Desktop resolves this already; Linux hosts need it spelled out.
      - 'host.docker.internal:host-gateway'

  # One-shot WP-CLI. `docker compose run --rm cli <args>` == `wp <args>`.
  cli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ['tools']
    depends_on:
      - wordpress
    environment: *wp-environment
    volumes: *wp-volumes
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    user: '33:33'
    entrypoint: ['wp']

  # PHPUnit against a real WordPress. Its own container so the test run does not
  # depend on whatever PHP the host happens to have.
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      WP_TESTS_DB_HOST: db
      WP_TESTS_DB_NAME: wp_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
    volumes:
      - ./:/app
      - composer-cache:/tmp/composer
    working_dir: /app

volumes:
  wordpress:
  db:
  composer-cache:
